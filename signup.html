<!DOCTYPE html>
<html lang="en">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
           
        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            width: 350px;
            max-width: 90%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        form h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 19px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }

    </style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="signupForm">
          <h1>Sign Up</h1>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>
        <button type="submit">Sign Up</button>
    </form>
        <script type="module">
          import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js'
    import { getAuth , createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js'

        const firebaseConfig = {
  apiKey: "AIzaSyDmBvUBGQXXFBNgRcxRVOKxUYpXi6DgrT0",
  authDomain: "website-51e7b.firebaseapp.com",
  projectId: "website-51e7b",
  storageBucket: "website-51e7b.firebasestorage.app",
  messagingSenderId: "164997522735",
  appId: "1:164997522735:web:6ddc57b571dc65f4bdadda"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
console.log("signup button clicked");
document.getElementById("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    await createUserWithEmailAndPassword(auth, email, password);

    alert("Account Created Successfully!");
  } catch (error) {
    alert(error.code + " : " + error.message);
    console.log(error);
  }
});
    </script>
</body>
</html>
