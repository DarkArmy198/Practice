<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: 'Times New Roman', Times, serif;
            background-color: lightseagreen;
        }
        #sidebar{
            width: 160px;
            height: 100%;
background-color: black;
position: fixed;
padding: 10px 10px;
padding-top: 150px;
top: 0;
left: -200px;
        }
        #sidebar a{
            display: block;
            color: white;
            padding: 15px 15px;
            text-decoration: none;
            letter-spacing: 1px;
            border-radius: 5px;
            border-bottom: 2px solid white;
text-align: center;
            font-size: 18px;
        }
        #sidebar a:hover{
            transition: 0.3s;
            background-color: white;
            color: black;
        }
        #open-btn{
            font-size: 27px;
            cursor: pointer;
            display: block;
            color: black;
            padding: 10px 10px;
        }
        #close-btn{
            font-size: 20px;
            cursor: pointer;
            display: block;
            color: white;
            padding: 10px 10px;
            top: 10px;
            right: 10px;
            position: absolute;
        }
        #sidebar #circle img{
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }
        #sidebar #circle{
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: -70px auto 20px auto;

        }

        .main-content{
            margin-left: 160px;
            padding: 20px;
        }
        @media screen and (max-width: 600px) {
            #open-btn {
                display: block;
            }
            #close-btn {
                display: block;
            }
            #sidebar.active{
                left: 0;
            }
            .main-content{
                margin-left: 0;
            }
            
        }
    </style>
</head>
<span id="open-btn">☰</span>
<body>
 <div id="sidebar">
    <div id="circle">
        <img src="https://wallpapers-max.b-cdn.net/wallpapers/2025/26oct/thumb/shy-parrot-sitting-in-a-green-forest-wallpaper.jpg" alt="">
    </div>
    <span id="close-btn">✕</span>
         <a href="#">Home</a>
            <a href="#">Search</a>
                <a href="#">About Us</a>
                    <a href="#">Contact</a>
 </div>
 <div class="main-content">
    <h1>Main Content</h1>
    <p>This is the main content area.</p>
 </div>
 <script type="text/javascript">
    let openBtn = document.getElementById('open-btn');
    let closeBtn = document.getElementById('close-btn');        
    let sidebar = document.getElementById('sidebar');
    openBtn.onclick = function(){
        sidebar.classList.add('active');
    }
    closeBtn.onclick = function(){
        sidebar.classList.remove('active');
    }

 </script>
</body>
</html>
